<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A2A3C">
<title>리더보드 - Kiho Labs</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  :root {
    --bg:#0A2A3C; --ink:#F2F8FB; --ink-soft:#B9CDD8; --ink-faint:#8FAAB8;
    --mint:#6FF2E0; --mint-ink:#062230; --danger:#FFA3B0; --ok:#9BF7CC;
    --edge:rgba(255,255,255,.18); --field-bg:rgba(255,255,255,.07);
    --r-card:28px; --r-ctrl:14px; --ease:cubic-bezier(.3,.8,.2,1);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body {
    margin:0; min-height:100dvh;
    background: linear-gradient(160deg,#0C3549 0%,#0A2A3C 48%,#071F2E 100%); background-attachment:fixed;
    color:var(--ink); font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; } button { font-family:inherit; }
  :focus-visible { outline:2px solid var(--mint); outline-offset:2px; }

  .page { position:relative; min-height:100dvh; padding:24px 16px 72px; overflow:clip; }
  .wrap { position:relative; z-index:1; width:min(1040px,100%); margin:0 auto; }
  .orbs { position:absolute; inset:0; z-index:0; pointer-events:none; }
  .orb { position:absolute; border-radius:50%; }
  .orb--mint { width:520px; height:520px; left:-240px; top:-120px; background:radial-gradient(circle,rgba(34,211,197,.7),rgba(34,211,197,0) 68%); }
  .orb--cobalt { width:620px; height:620px; right:-300px; bottom:-260px; background:radial-gradient(circle,rgba(99,112,255,.8),rgba(99,112,255,0) 68%); }
  .orb--coral { width:300px; height:300px; left:12%; bottom:-150px; background:radial-gradient(circle,rgba(255,122,144,.7),rgba(255,122,144,0) 68%); }

  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700; letter-spacing:-.01em; text-decoration:none; }
  .brand svg { width:30px; height:30px; }
  .nav { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .pill { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 14px; border:0; border-radius:999px; text-decoration:none;
    background:rgba(255,255,255,.1); color:var(--ink); box-shadow:inset 0 0 0 1px var(--edge); font-size:14px; font-weight:600; cursor:pointer; transition:filter .2s; }
  .pill:hover { filter:brightness(1.12); }
  .pill--mint { background:var(--mint); color:var(--mint-ink); box-shadow:none; }
  .pill--sm { height:32px; padding:0 12px; font-size:13px; }

  .title-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  h1 { margin:0; font-size:32px; font-weight:800; letter-spacing:-.03em; }
  .season-chip { padding:4px 12px; border-radius:999px; font-size:13px; font-weight:800; color:#3a2200;
    background:linear-gradient(135deg,#fff3b8,#ffc93c 55%,#ff9d1e); box-shadow:0 0 14px rgba(255,190,60,.45); }
  .lead { margin:0 0 20px; color:var(--ink-soft); font-size:15px; }
  .lead a { color:var(--mint); font-weight:700; }

  .tabs { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { --accent:var(--mint); flex:none; display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 16px; border:0; border-radius:999px;
    background:var(--field-bg); color:var(--ink-soft); box-shadow:inset 0 0 0 1px var(--edge); font-size:14.5px; font-weight:600; cursor:pointer; transition:background .18s,color .18s,box-shadow .18s; }
  .tab:hover:not([aria-disabled="true"]) { background:rgba(255,255,255,.12); color:var(--ink); }
  .tab[aria-selected="true"] { color:var(--ink); background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 2px var(--accent); }
  .tab .d { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .tab small { font-size:11.5px; font-weight:500; color:var(--ink-faint); }
  .tab[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }
  .tab[data-diff="easy"] { --accent:#9BF7CC; } .tab[data-diff="normal"] { --accent:#7CC8FF; }
  .tab[data-diff="hard"] { --accent:#FFC86B; } .tab[data-diff="extreme"] { --accent:#FF7A90; }

  .me { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:16px 18px; margin:4px 0 16px; border-radius:20px;
    background:linear-gradient(160deg,rgba(111,242,224,.16),rgba(111,242,224,.05)); box-shadow:inset 0 0 0 1px rgba(111,242,224,.38); }
  .me--plain { background:var(--field-bg); box-shadow:inset 0 0 0 1px var(--edge); }
  .me-rank { min-width:64px; text-align:center; }
  .me-rank b { display:block; font-size:30px; font-weight:800; color:var(--mint); letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; }
  .me-rank span { font-size:12px; color:var(--ink-faint); }
  .me-body { flex:1; min-width:160px; } .me-title { font-size:15px; font-weight:700; } .me-sub { font-size:13px; color:var(--ink-soft); }

  .glass { padding:18px 14px 14px; border-radius:var(--r-card); background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
    -webkit-backdrop-filter:blur(26px) saturate(150%); backdrop-filter:blur(26px) saturate(150%);
    box-shadow:0 30px 60px -20px rgba(2,12,20,.55),inset 0 1px 0 rgba(255,255,255,.25); }
  .sec-h { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 4px 12px; }
  .sec-h h2 { margin:0; font-size:18px; font-weight:800; letter-spacing:-.02em; }

  /* 가로로 긴 TOP 100 행 */
  .cols, .row { display:grid; grid-template-columns:64px minmax(0,1fr) 96px 78px 128px 92px; align-items:center; gap:10px; }
  .cols { padding:0 16px 8px; font-size:12px; color:var(--ink-faint); font-weight:600; }
  .cols .r, .row .c { text-align:right; }
  .cols > :first-child, .row .rk { text-align:center; }
  .rows { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .row { --medal:transparent; position:relative; min-height:62px; padding:10px 16px; border-radius:16px; background:var(--field-bg);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); animation:rise .4s var(--ease) both; }
  .row::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:4px; border-radius:0 4px 4px 0; background:var(--medal); }
  .row[data-medal="1"] { --medal:linear-gradient(180deg,#FFEDB0,#FFC94D); background:linear-gradient(90deg,rgba(255,201,77,.16),var(--field-bg) 55%); box-shadow:inset 0 0 0 1px rgba(255,201,77,.4); }
  .row[data-medal="2"] { --medal:linear-gradient(180deg,#F4F8FB,#B4C4D0); background:linear-gradient(90deg,rgba(200,215,225,.14),var(--field-bg) 55%); box-shadow:inset 0 0 0 1px rgba(200,215,225,.35); }
  .row[data-medal="3"] { --medal:linear-gradient(180deg,#F7CBA5,#D08A56); background:linear-gradient(90deg,rgba(208,138,86,.15),var(--field-bg) 55%); box-shadow:inset 0 0 0 1px rgba(208,138,86,.35); }
  .row.is-me { background:rgba(111,242,224,.13); box-shadow:inset 0 0 0 1.5px rgba(111,242,224,.65); }
  .rk b { display:inline-grid; place-items:center; min-width:34px; height:34px; padding:0 6px; border-radius:50%; font-size:16px; font-weight:800; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .row[data-medal] .rk b { color:#1c1300; background:var(--medal); box-shadow:0 4px 14px -4px rgba(255,255,255,.35); }
  .row .kp-fr { margin:0 2px; }
  .pl { display:flex; align-items:center; gap:12px; min-width:0; border-radius:12px; cursor:pointer; }
  .pl:hover .nm { text-decoration:underline; text-decoration-color:rgba(255,255,255,.4); text-underline-offset:3px; }
  .pl:focus-visible { outline:2px solid var(--mint); outline-offset:3px; }
  .row[data-bg] .nm, .row[data-bg] .c, .row[data-bg] .meta, .row[data-bg] .rk b { text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .row[data-bg] { box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); }
  .row[data-bg][data-medal="1"] { box-shadow:inset 0 0 0 1.5px rgba(255,201,77,.6); }
  .row[data-bg][data-medal="2"] { box-shadow:inset 0 0 0 1.5px rgba(200,215,225,.55); }
  .row[data-bg][data-medal="3"] { box-shadow:inset 0 0 0 1.5px rgba(208,138,86,.55); }
  .row[data-bg].is-me { box-shadow:inset 0 0 0 1.5px rgba(111,242,224,.8); }
  .av { flex:none; width:40px; height:40px; display:grid; place-items:center; border-radius:50%; font-size:16px; font-weight:800; color:var(--ink);
    background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.08)); box-shadow:inset 0 0 0 1px var(--edge); }
  .row[data-medal] .av { color:#1c1300; background:var(--medal); box-shadow:none; }
  .pl-t { min-width:0; } .nm { font-size:15.5px; font-weight:700; }
  .meta { display:none; font-size:12.5px; color:var(--ink-faint); }
  .c { font-size:14px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .c-score { font-size:18px; font-weight:800; color:var(--ink); letter-spacing:-.01em; } .row[data-medal="1"] .c-score { color:#FFE08A; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .skel { pointer-events:none; animation:none; }
  .skel i { display:block; height:14px; border-radius:7px; background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.17),rgba(255,255,255,.07)); background-size:200% 100%; animation:shimmer 1.3s linear infinite; }
  .skel i:nth-child(1) { width:26px; margin:0 auto; } .skel i:nth-child(2) { width:45%; } .skel i:nth-child(n+3) { width:60%; margin-left:auto; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .refresh { width:36px; padding:0; } .refresh svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .refresh[data-busy="true"] svg { animation:spin .8s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
  .foot { margin:14px 4px 2px; font-size:12.5px; color:var(--ink-faint); text-align:center; }
  .state { text-align:center; padding:34px 12px 26px; color:var(--ink-soft); }
  .state h3 { margin:0 0 6px; font-size:18px; color:var(--ink); } .state p { margin:0 0 16px; font-size:14px; } .state--error h3 { color:var(--danger); }

  @media (max-width:820px) { .cols, .row { grid-template-columns:52px minmax(0,1fr) 88px 70px 112px; } .cols .c-date, .row .c-date { display:none; } }
  @media (max-width:600px) {
    h1 { font-size:26px; } .brand span { display:none; } .cols { display:none; }
    .row { grid-template-columns:44px minmax(0,1fr) auto; padding:10px 12px; } .row .c-stage, .row .c-combo, .row .c-date { display:none; }
    .meta { display:block; } .c-score { font-size:16px; } .av { width:36px; height:36px; }
  }
  @media (prefers-reduced-motion:reduce) { .row { animation:none; } .skel i,.refresh[data-busy="true"] svg { animation:none; } }
</style>
</head>
<body>
<div class="page">
  <div class="orbs" aria-hidden="true"><i class="orb orb--mint"></i><i class="orb orb--cobalt"></i><i class="orb orb--coral"></i></div>

  <main class="wrap">
    <header class="top">
      <a class="brand" href="games.html" aria-label="메인 화면으로">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="10" fill="#6FF2E0" fill-opacity=".85"/><circle cx="20" cy="16" r="10" fill="#7C8BFF" fill-opacity=".75"/></svg>
        <span>Kiho Labs</span>
      </a>
      <nav class="nav">
        <a class="pill" href="games.html">메인</a>
        <a class="pill" href="tags.html">내 태그</a>
        <a class="pill" href="codex.html">태그 도감</a>
        <a class="pill pill--mint" id="nav-account" href="login.html">로그인</a>
      </nav>
    </header>

    <div class="title-row"><h1>리더보드</h1><span class="season-chip" id="season-chip" hidden></span></div>
    <p class="lead">난이도별 최고 기록으로 TOP 100 순위를 매겨요. 이름 옆 태그는 내 등급이거나 직접 장착한 태그예요. <a href="games.html#tiers">등급표 보기</a></p>

    <div class="tabs" role="tablist" aria-label="게임 선택" id="game-tabs"></div>
    <div class="tabs" role="tablist" aria-label="난이도 선택" id="diff-tabs"></div>
    <section class="me" id="me" hidden></section>

    <section class="glass" aria-labelledby="board-title">
      <div class="sec-h">
        <h2 id="board-title">TOP 100</h2>
        <button class="pill pill--sm refresh" type="button" id="btn-refresh" aria-label="새로고침" data-busy="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
      <div class="cols" aria-hidden="true"><span>순위</span><span>플레이어</span><span class="r c-stage">스테이지</span><span class="r c-combo">콤보</span><span class="r c-score">점수</span><span class="r c-date">달성일</span></div>
      <ol class="rows" id="rows" aria-live="polite"></ol>
      <div class="state" id="state" hidden></div>
      <p class="foot" id="foot" hidden></p>
    </section>
  </main>
</div>

<script src="kiho-sdk.js"></script>
<script src="kiho-badge.js"></script>
<script src="kiho-nav.js" defer></script>
<script src="kiho-profile.js"></script>
<script>
(function () {
  'use strict';

  /* 예전 주소(?tab=tier / ?tab=quest)로 들어오면 메인 화면의 등급표/퀘스트로 보내 줍니다 */
  var qs = new URLSearchParams(location.search);
  if (qs.get('tab') === 'tier' || qs.get('tab') === 'quest') {
    location.replace('games.html#' + (qs.get('tab') === 'tier' ? 'tiers' : 'quests'));
    return;
  }

  /* SDK 를 못 불러와도 랭킹 조회는 동작합니다. */
  var API_BASE = (typeof Kiho !== 'undefined' && Kiho.CONFIG && Kiho.CONFIG.API_BASE) || 'https://api.kiholabs.com';
  var TOP_N = 100;
  var TIMEOUT_MS = 15000;
  var LS_DIFF_PREFIX = 'kiho.';   // 게임별로 마지막 난이도를 따로 기억 (kiho.nf.difficulty, kiho.pd.difficulty ...)

  var GAMES = [
    { id: 'number-forge',    code: 'nf', name: '넘버 포지',  ready: true,  play: 'number-forge.html' },
    { id: 'pixel-detective', code: 'pd', name: '픽셀 탐정',  ready: true,  play: 'pixel-detective.html' },
    { id: 'mirror-beam',     code: 'mb', name: '미러 빔 랩', ready: true,  play: 'mirror-beam.html' },
    { id: 'code-breaker',    code: 'cb', name: '코드 브레이커', ready: true, play: 'code-breaker.html' },
    { id: 'memory-grid',     code: 'mg', name: '메모리 그리드', ready: true, play: 'memory-grid.html' },
    { id: 'light-switch',    code: 'ls', name: '라이트 스위치', ready: true, play: 'light-switch.html' },
    { id: 'color-flood',     code: 'cf', name: '컬러 플러드', ready: true, play: 'color-flood.html' }
  ];
  var DIFFS = [
    { key: 'easy', name: 'Easy', ko: '쉬움' }, { key: 'normal', name: 'Normal', ko: '보통' },
    { key: 'hard', name: 'Hard', ko: '어려움' }, { key: 'extreme', name: 'Extreme', ko: '극한' }
  ];

  var $ = function (s) { return document.querySelector(s); };
  var isMember = typeof Kiho !== 'undefined' && Kiho.isMember();
  var state = { game: 'number-forge', diff: 'normal' };
  var board = { rows: [], total: 0, me: null, season: null, status: 'loading', error: '' };
  var reqId = 0;

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function fmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function formatDate(iso) { var d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
  function diffOf(key) { return DIFFS.filter(function (d) { return d.key === key; })[0]; }
  function gameOf(id) { return GAMES.filter(function (g) { return g.id === id; })[0]; }
  function lsDiffKey(gameId) { var g = gameOf(gameId); return LS_DIFF_PREFIX + (g ? g.code : 'nf') + '.difficulty'; }

  /* 이름 + [ADMIN](admin/kiho) + 태그(장착한 태그, 없으면 현재 등급) */
  function renderName(node, username, tags) {
    if (typeof KihoBadge !== 'undefined') KihoBadge.render(node, username, { tags: tags });
    else node.textContent = String(username) + ((tags || []).map(function (t) { return '  [' + t.name + ']'; }).join(''));
  }

  (function init() {
    var g = qs.get('game');
    if (GAMES.some(function (x) { return x.id === g && x.ready; })) state.game = g;
    var d = qs.get('difficulty') || safeGet(lsDiffKey(state.game));
    if (diffOf(d)) state.diff = d;
  })();
  function syncUrl() { history.replaceState(null, '', '?game=' + encodeURIComponent(state.game) + '&difficulty=' + encodeURIComponent(state.diff)); }

  function buildFilters() {
    var gt = $('#game-tabs'); gt.textContent = '';
    GAMES.forEach(function (g) {
      var b = el('button', 'tab'); b.type = 'button'; b.setAttribute('role', 'tab');
      b.appendChild(document.createTextNode(g.name));
      if (!g.ready) { b.appendChild(el('small', '', '준비 중')); b.setAttribute('aria-disabled', 'true'); }
      b.setAttribute('aria-selected', String(g.id === state.game));
      b.addEventListener('click', function () {
        if (!g.ready || g.id === state.game) return;
        state.game = g.id;
        var remembered = safeGet(lsDiffKey(state.game));          // 이 게임에서 마지막으로 보던 난이도 복원
        if (diffOf(remembered)) state.diff = remembered;
        onFilter();
      });
      gt.appendChild(b);
    });
    var dt = $('#diff-tabs'); dt.textContent = '';
    DIFFS.forEach(function (d) {
      var b = el('button', 'tab'); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('data-diff', d.key);
      b.appendChild(el('span', 'd')); b.appendChild(document.createTextNode(d.name)); b.appendChild(el('small', '', d.ko));
      b.setAttribute('aria-selected', String(d.key === state.diff));
      b.addEventListener('click', function () { if (d.key !== state.diff) { state.diff = d.key; safeSet(lsDiffKey(state.game), d.key); onFilter(); } });
      dt.appendChild(b);
    });
  }
  function onFilter() { buildFilters(); syncUrl(); load(); }

  function load() {
    var id = ++reqId;
    board.rows = []; board.total = 0; board.me = null; board.status = 'loading'; board.error = '';
    render();

    var ctrl = new AbortController(), timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
    var headers = { 'Accept': 'application/json' };
    if (typeof Kiho !== 'undefined' && Kiho.isMember() && Kiho.token()) headers['Authorization'] = 'Bearer ' + Kiho.token();

    fetch(API_BASE.replace(/\/$/, '') + '/api/board?game=' + encodeURIComponent(state.game) + '&difficulty=' + encodeURIComponent(state.diff) + '&limit=' + TOP_N,
          { headers: headers, signal: ctrl.signal })
      .then(function (res) { return res.json().catch(function () { return null; }).then(function (data) { return { res: res, data: data }; }); })
      .then(function (r) {
        if (id !== reqId) return;
        if (!r.res.ok || !r.data || !r.data.success) {
          throw { friendly: true, message: (r.data && r.data.error) ||
            (r.res.status === 404 ? '서버에서 랭킹 API를 찾지 못했어요. Worker 배포 상태를 확인해 주세요.' : '리더보드를 불러오지 못했어요.') };
        }
        board.rows = r.data.rows || []; board.total = r.data.total || 0; board.me = r.data.me || null;
        board.season = r.data.season || null; board.status = 'ready';
        render();
      })
      .catch(function (err) {
        if (id !== reqId) return;
        board.status = 'error';
        board.error = err && err.friendly ? err.message
          : err && err.name === 'AbortError' ? '서버 응답이 늦어지고 있어요. 잠시 후 다시 시도해 주세요.'
          : '서버에 연결하지 못했어요. 네트워크 상태를 확인해 주세요.';
        render();
      })
      .then(function () { clearTimeout(timer); });
  }

  function rowEl(row, i) {
    var li = el('li', 'row' + (row.is_me ? ' is-me' : ''));
    if (row.rank <= 3) li.setAttribute('data-medal', String(row.rank));
    li.style.animationDelay = Math.min(i, 14) * 22 + 'ms';

    var rk = el('span', 'rk'); rk.appendChild(el('b', '', String(row.rank))); li.appendChild(rk);

    if (typeof KihoProfile !== 'undefined' && row.bg) KihoProfile.applyBg(li, row.bg);

    var pl = el('div', 'pl');
    if (typeof KihoProfile !== 'undefined') {
      pl.setAttribute('role', 'button'); pl.tabIndex = 0; pl.title = row.username + ' 프로필 보기';
      pl.addEventListener('click', function () { KihoProfile.open(row.username); });
      pl.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); KihoProfile.open(row.username); } });
      var rf = row.frame || KihoProfile.rankFrame(row.rank);
      if (rf) pl.appendChild(KihoProfile.framed(KihoProfile.avatar(row.username, row.avatar, 0, 'av'), 36, rf, 1));
      else pl.appendChild(KihoProfile.avatar(row.username, row.avatar, 0, 'av'));
    } else pl.appendChild(el('span', 'av', String(row.username).charAt(0).toUpperCase()));
    var t = el('div', 'pl-t'); var nm = el('div', 'nm'); renderName(nm, row.username, row.tags); t.appendChild(nm);
    t.appendChild(el('div', 'meta', row.stage + '/5 스테이지 · 콤보 ×' + row.combo + (row.achieved_at ? ' · ' + formatDate(row.achieved_at) : '')));
    pl.appendChild(t); li.appendChild(pl);

    li.appendChild(el('span', 'c c-stage', row.stage + '/5'));
    li.appendChild(el('span', 'c c-combo', '×' + row.combo));
    li.appendChild(el('b', 'c c-score', fmt(row.score)));
    li.appendChild(el('span', 'c c-date', row.achieved_at ? formatDate(row.achieved_at) : ''));
    return li;
  }

  function renderMe() {
    var box = $('#me'); box.textContent = ''; box.className = 'me'; box.hidden = false;
    var d = diffOf(state.diff), g = gameOf(state.game);
    if (!isMember) {
      box.classList.add('me--plain');
      var b = el('div', 'me-body'); b.appendChild(el('div', 'me-title', '로그인하면 내 순위를 볼 수 있어요'));
      b.appendChild(el('div', 'me-sub', '게스트는 점수를 리더보드에 등록할 수 없어요.')); box.appendChild(b);
      var a = el('a', 'pill pill--mint', '로그인'); a.href = 'login.html?next=' + encodeURIComponent(location.pathname.split('/').pop() || 'leaderboard.html'); box.appendChild(a);
      return;
    }
    if (board.status === 'loading') { box.hidden = true; return; }
    if (board.me) {
      var rk = el('div', 'me-rank'); rk.appendChild(el('b', '', fmt(board.me.rank) + '위')); rk.appendChild(el('span', '', '내 순위'));
      var bd = el('div', 'me-body');
      bd.appendChild(el('div', 'me-title', d.name + ' 최고 ' + fmt(board.me.score) + '점'));
      bd.appendChild(el('div', 'me-sub', board.me.stage + '/5 스테이지 · 최고 콤보 ×' + board.me.combo + ' · ' + fmt(board.me.plays) + '회 도전'));
      box.appendChild(rk); box.appendChild(bd);
      if (board.me.rank > TOP_N) box.appendChild(el('span', 'me-sub', 'TOP ' + TOP_N + ' 밖이에요. 조금만 더!'));
    } else if (board.status === 'ready') {
      box.classList.add('me--plain');
      var b2 = el('div', 'me-body'); b2.appendChild(el('div', 'me-title', d.name + ' 기록이 아직 없어요'));
      b2.appendChild(el('div', 'me-sub', '한 판 클리어하면 바로 순위에 올라가요.')); box.appendChild(b2);
      if (g.play) { var p = el('a', 'pill pill--mint', '도전하기'); p.href = g.play; box.appendChild(p); }
    } else { box.hidden = true; }
  }

  function stateBlock(kind) {
    var st = $('#state'); st.textContent = ''; st.className = 'state' + (kind === 'error' ? ' state--error' : ''); st.hidden = false;
    if (kind === 'error') {
      st.appendChild(el('h3', '', '불러오지 못했어요')); st.appendChild(el('p', '', board.error));
      var r = el('button', 'pill pill--mint', '다시 시도'); r.type = 'button'; r.addEventListener('click', load); st.appendChild(r);
    } else {
      st.appendChild(el('h3', '', '아직 기록이 없어요')); st.appendChild(el('p', '', '첫 번째 주인공이 되어 보세요!'));
      var g = gameOf(state.game); if (g.play) { var a = el('a', 'pill pill--mint', '지금 도전하기'); a.href = g.play; st.appendChild(a); }
    }
  }

  function render() {
    var rows = $('#rows'), st = $('#state'), foot = $('#foot');
    var d = diffOf(state.diff), g = gameOf(state.game);
    rows.textContent = ''; st.hidden = true; foot.hidden = true;
    $('#btn-refresh').setAttribute('data-busy', String(board.status === 'loading'));
    $('#nav-account').textContent = isMember ? '내 계정' : '로그인';
    if (isMember) $('#nav-account').href = 'profile.html';
    $('#board-title').textContent = 'TOP ' + TOP_N + ' · ' + g.name + ' · ' + d.name;
    var chip = $('#season-chip');
    if (board.season && board.season.current) { chip.textContent = '시즌 ' + board.season.current; chip.hidden = false; } else chip.hidden = true;
    renderMe();

    if (board.status === 'loading') {
      for (var i = 0; i < 8; i++) {
        var s = el('li', 'row skel'); s.setAttribute('aria-hidden', 'true');
        for (var k = 0; k < 5; k++) s.appendChild(el('i')); rows.appendChild(s);
      }
      return;
    }
    if (board.status === 'error') { stateBlock('error'); return; }
    if (!board.rows.length) { stateBlock('empty'); return; }

    board.rows.forEach(function (r, idx) { rows.appendChild(rowEl(r, idx)); });
    foot.textContent = '참가 ' + fmt(board.total) + '명' + (board.total > TOP_N ? ' · 상위 ' + TOP_N + '명만 표시돼요' : '');
    foot.hidden = false;
  }

  $('#btn-refresh').addEventListener('click', load);
  buildFilters();
  load();
})();
</script>
</body>
</html>
